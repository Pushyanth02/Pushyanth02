    .d1{fill:#FF5F57}.d2{fill:#FEBC2E}.d3{fill:#28C840}
  </style>
  <rect x="1" y="1" width="378" height="52" rx="10" fill="url(#bg)" stroke="#30363D"/>
  <circle class="d1" cx="20" cy="16" r="4"/>
  <circle class="d2" cx="34" cy="16" r="4"/>
  <circle class="d3" cx="48" cy="16" r="4"/>
