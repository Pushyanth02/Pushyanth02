<svg xmlns="http://www.w3.org/2000/svg" width="380" height="54" viewBox="0 0 380 54" role="img" aria-label="status">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#161B22"/>
      <stop offset="1" stop-color="#0D1117"/>
    </linearGradient>
  </defs>
  <style>
    .t{font:700 15px Consolas,'SF Mono',monospace;fill:#A7F3D0}
