name: update profile art

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: profile-art
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pillow

      - name: Fetch GitHub data (GraphQL)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: Pushyanth02
        run: python scripts/fetch_data.py dist/user-data.json

      - name: Generate contribution heatmaps (light + dark)
        run: python scripts/render_heatmap.py dist/user-data.json dist

      - name: Generate ASCII portrait from avatar
        run: |
          python scripts/prep_photo.py https://github.com/Pushyanth02.png dist
          python scripts/make_ascii_svg.py dist/ascii_grid.json dist/avi-ascii.svg

      - name: Generate streak/numbers card
        run: python scripts/render_stats_svg.py dist/user-data.json dist/stats.svg

      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Pushyanth02
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Self-host streak stats card (bypasses broken camo proxy)
        run: |
          curl -fsSL --retry 3 --retry-delay 5 --max-time 60 -o dist/streak-stats.svg \
            "https://streak-stats.demolab.com?user=Pushyanth02&theme=radical&border=true&border_radius=10"
          test -s dist/streak-stats.svg

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
